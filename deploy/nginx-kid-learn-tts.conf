# ============================================================
# 小小花 · 微信 TTS 同源代理（可直接 copy）
# 域名示例：kid-learn.wingedge777.com
# 静态根目录：/var/www/kid-learn
# ============================================================
#
# 【一次性操作】
# 1) SSH 登录 VPS
# 2) 把「A. map」粘进 /etc/nginx/nginx.conf 的 http { } 里（与其它 map 同级）
# 3) 把「B. location」粘进你的站点 server { } 里
#    （常见路径：/etc/nginx/sites-available/kid-learn 或 conf.d/xxx.conf）
# 4) sudo nginx -t && sudo systemctl reload nginx
# 5) 验收：
#    curl -sI "https://kid-learn.wingedge777.com/api/tts?text=%E4%BD%A0%E5%A5%BD&lang=zh"
#    期望：HTTP/2 200 且 content-type: audio/mpeg
#
# ============================================================
# A. 放到 http { } 里（只加一次）
# ------------------------------------------------------------
# map $arg_lang $tts_lan {
#     default zh;
#     ~*^en   en;
# }
#
# ============================================================
# B. 放到对应 server { } 里（与 location / 同级）
# ------------------------------------------------------------

location = /api/tts {
    # 浏览器：GET /api/tts?text=木头会浮在水面&lang=zh
    # Nginx：  服务端去拉百度，微信只看见你的域名

    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
    resolver_timeout 5s;

    set $baidu_tts https://fanyi.baidu.com/gettts;

    # 若未配置 A 的 map，取消下面两行注释，并注释掉带 $tts_lan 的 proxy_pass
    # set $tts_lan zh;
    # if ($arg_lang ~* ^en) { set $tts_lan en; }

    # spd 可传 1–7，默认 3；拼音四声操练前端会传 spd=1
    set $tts_spd $arg_spd;
    if ($tts_spd = "") { set $tts_spd 3; }

    proxy_pass $baidu_tts?lan=$tts_lan&text=$arg_text&spd=$tts_spd&source=web;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host fanyi.baidu.com;
    proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36";
    proxy_set_header Accept "audio/mpeg,audio/*;q=0.9,*/*;q=0.8";
    proxy_set_header Referer "https://fanyi.baidu.com/";

    proxy_connect_timeout 8s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    proxy_buffering on;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Set-Cookie;

    add_header Cache-Control "public, max-age=86400" always;
    add_header Access-Control-Allow-Origin "*" always;
}

